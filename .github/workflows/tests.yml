name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - name: Check rankings data and updater
        run: pytest tests/test_data.py tests/test_update_rankings.py -q

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - name: Check all links in index.html
        run: pytest tests/test_urls.py -v --tb=short
