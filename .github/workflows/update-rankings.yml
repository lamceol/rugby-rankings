name: Update rankings

on:
  schedule:
    # World Rugby publishes new rankings on Mondays; run Monday evening UTC
    # (Tuesday morning in Australia).
    - cron: "23 18 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: update-rankings

jobs:
  update:
    # Only ever run main's code with the push token (see environment below).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # main is protected, so the default token can't push to it. RANKINGS_TOKEN
    # is a fine-grained token (Contents: read and write, this repo only) from a
    # repo admin, who may bypass the protection. It's stored in the
    # "rankings-update" environment, which only releases it to runs on main,
    # so a workflow edited on another branch can't read it.
    environment: rankings-update
    steps:
      - name: Check the push token is set
        env:
          RANKINGS_TOKEN: ${{ secrets.RANKINGS_TOKEN }}
        run: |
          if [ -z "$RANKINGS_TOKEN" ]; then
            echo "::error::Add RANKINGS_TOKEN to the rankings-update environment (Settings > Environments)"
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          persist-credentials: false  # keep tokens out of later steps
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt

      - name: Fetch latest rankings from World Rugby
        run: python scripts/update_rankings.py

      - name: Sanity-check the new data
        # A nation missing from data/teams.json shouldn't block the update;
        # it's flagged by the last step instead.
        run: pytest tests/test_data.py -q -k "not on_the_map"

      - name: Commit if changed
        # The token is only given to this step, which runs no repo code.
        env:
          RANKINGS_TOKEN: ${{ secrets.RANKINGS_TOKEN }}
        run: |
          if git diff --quiet index.html; then
            echo "Rankings unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          AS_OF=$(grep -oP '"asOf": "\K[0-9-]+' index.html || echo latest)
          git commit -am "Update rankings to $AS_OF"
          git push "https://x-access-token:${RANKINGS_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Check every nation is on the map
        run: pytest tests/test_data.py -q -k "on_the_map"
