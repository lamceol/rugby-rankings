<style>

    --bg:       #090e0b;
    --bg-card:  #0f1a12;
    --bg-muted: #152019;
    --border:   #1e3326;
    --fg:       #d4e8da;
    --fg-muted: #6b9477;
    --fg-dim:   #2e4d38;
    --gold:     #e8b84b;
    --gold-dim: #8a6b1c;
    --green:    #22a65c;
    --up:       #4ade80;
    --down:     #f87171;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Barlow', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    margin: 0;
    padding-left:  max(16px, env(safe-area-inset-left,  0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
  }
  .header {
    display: flex; align-items: flex-end; justify-content: space-between;
    flex-wrap: wrap; gap: 8px; padding-block: 20px 16px;
    border-bottom: 1px solid var(--border);
  }
  .eyebrow {
    font-family: 'Barlow Condensed', sans-serif; font-size: 11px;
    font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--gold);
  }
  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(24px,5vw,40px); font-weight: 800;
    line-height: 1; color: var(--fg); margin: 0;
  }
  h1 span { color: var(--gold); }
  .updated { font-size: 12px; color: var(--fg-muted); font-weight: 300; }
  .header-stats { display: flex; gap: 24px; flex-wrap: wrap; }
  .stat { text-align: right; }
  .stat-val {
    font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700;
    color: var(--gold); display: block; line-height: 1;
  }
  .stat-label { font-size: 11px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: .08em; }

  #map-wrap {
    position: relative; background: #050a07;
    margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
    width: calc(100% + max(16px, env(safe-area-inset-left, 0px)) + max(16px, env(safe-area-inset-right, 0px)));
  }
  #map-svg { display: block; width: 100%; height: auto; cursor: crosshair; }
  .country { transition: opacity .12s; }
  .country:hover { opacity: .7; cursor: pointer; }
  .graticule { fill: none; stroke: #0a1a0e; stroke-width: 0.3px; }
  .sphere { fill: #050a07; }
  .border { fill: none; stroke: #0d1f16; stroke-width: 0.5px; }
  .uk-lad { stroke-width: 0px; }
  .uk-lad:hover { opacity: .7; cursor: pointer; }
  .uk-border { fill: none; stroke-width: 1px; pointer-events: none; }

  #tooltip {
    position: fixed; background: #0b1710; border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 14px; pointer-events: none;
    opacity: 0; transition: opacity .1s; z-index: 100;
    max-width: 230px; box-shadow: 0 4px 20px rgba(0,0,0,.6);
  }
  #tooltip.visible { opacity: 1; }
  .tt-rank {
    font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase; color: var(--gold); margin-bottom: 2px;
  }
  .tt-name { font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 700; color: var(--fg); line-height: 1.2; }
  .tt-pts { font-size: 13px; color: var(--fg-muted); margin-top: 4px; }
  .tt-note { font-size: 11px; color: var(--fg-dim); margin-top: 2px; font-style: italic; }

  #legend {
    display: flex; align-items: center; gap: 12px;
    padding: 10px max(16px, env(safe-area-inset-left,0px));
    background: #050a07;
    margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
    width: calc(100% + max(16px, env(safe-area-inset-left, 0px)) + max(16px, env(safe-area-inset-right, 0px)));
    border-bottom: 1px solid var(--border);
  }
  .legend-label { font-size: 11px; color: var(--fg-muted); white-space: nowrap; }
  #legend-bar {
    flex: 1; height: 8px; border-radius: 4px;
    background: linear-gradient(to right, #3a3a3a, #0f3320, #1a6040, #22a65c, #c9963a, #e8b84b, #f1c40f);
  }

  .top-bar {
    display: flex; gap: 10px; overflow-x: auto; padding-block: 16px;
    border-bottom: 1px solid var(--border); scrollbar-width: none;
  }
  .top-bar::-webkit-scrollbar { display: none; }
  .top-card {
    flex: 0 0 auto; background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 14px; min-width: 130px;
    position: relative; overflow: hidden;
  }
  .top-card::before {
    content: ''; position: absolute; inset: 0 auto 0 0;
    width: 2px; background: var(--gold);
  }
  .top-card-pos {
    font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700;
    letter-spacing: .1em; color: var(--gold-dim); text-transform: uppercase; margin-bottom: 2px;
  }
  .top-card-name { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700; color: var(--fg); line-height: 1.2; }
  .top-card-pts { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; color: var(--fg-muted); margin-top: 2px; }

  .table-section { padding-block: 24px 32px; }
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 16px; flex-wrap: wrap; gap: 8px;
  }
  .section-head h2 {
    font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; color: var(--fg-muted); margin: 0;
  }
  .filter-wrap { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn {
    font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase; background: var(--bg-muted);
    border: 1px solid var(--border); color: var(--fg-muted); padding: 4px 10px;
    border-radius: 3px; cursor: pointer; transition: border-color .15s, color .15s;
  }
  .filter-btn:hover, .filter-btn.active { border-color: var(--gold); color: var(--gold); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead th {
    font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase; color: var(--fg-dim);
    text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border);
  }
  thead th.right { text-align: right; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
  tbody tr:hover { background: var(--bg-muted); }
  td { padding: 9px 10px; vertical-align: middle; }
  td.right { text-align: right; }
  .rank-swatch {
    display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    margin-right: 6px; vertical-align: middle; flex-shrink: 0;
  }
  .rank-num {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px;
    color: var(--fg-muted); min-width: 28px; display: inline-block;
  }
  .rank-num.top3 { color: var(--gold); }
  .country-name { font-weight: 500; color: var(--fg); }
  .pts-val {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 15px;
    color: var(--fg); font-variant-numeric: tabular-nums;
  }
  .move {
    font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 2px; min-width: 36px;
    justify-content: flex-end; font-variant-numeric: tabular-nums;
  }
  .move.up { color: var(--up); } .move.down { color: var(--down); } .move.same { color: var(--fg-dim); }
  .tier {
    font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 2px;

  .tier-1 { background: rgba(232,184,75,.15); color: var(--gold); }
  .tier-2 { background: rgba(34,166,92,.15); color: var(--green); }

  footer {
    border-top: 1px solid var(--border); padding-block: 20px; font-size: 12px;
    color: var(--fg-dim); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  footer a { color: var(--fg-muted); }
</style>

// ── Colour scale ──────────────────────────────────────────────
// Top-10 get distinct stepped colours; below that a continuous scale; unranked = grey
const TOP10_COLORS = [
  '#f1c40f', // #1  bright gold
  '#e8a020', // #2  deep amber
  '#d4781a', // #3  orange
  '#c05214', // #4  burnt orange
  '#a84810', // #5  brick
  '#8f6010', // #6  ochre
  '#6a8c14', // #7  olive
  '#3a9e30', // #8  grass green
  '#1a9060', // #9  teal green
  '#0e8078', // #10 dark teal
];
const UNRANKED_COLOR = '#2c2c2c';

function rankColor(pts, pos) {
  if (pos <= 10) return TOP10_COLORS[pos - 1];
  // Rank 11-114: map pts from ~7 to ~76 onto dark-green → mid-green
  const t = Math.max(0, Math.min(1, (pts - 7) / (76.38 - 7)));
  return d3.interpolateRgb('#131a14', '#1f7a48')(t);
}

// ── Map setup ─────────────────────────────────────────────────
const svg = d3.select('#map-svg');
const projection = d3.geoNaturalEarth1().scale(153).translate([480, 250]);
const path = d3.geoPath().projection(projection);

svg.append('path').datum({type:'Sphere'}).attr('class','sphere').attr('d', path);
svg.append('path').datum(d3.geoGraticule()()).attr('class','graticule').attr('d', path);

// World countries (skip 826 = UK)
const countries = topojson.feature(TOPO, TOPO.objects.countries);
const borders   = topojson.mesh(TOPO, TOPO.objects.countries, (a,b) => a !== b);

const tt     = document.getElementById('tooltip');
const ttRank = document.getElementById('tt-rank');
const ttName = document.getElementById('tt-name');
const ttPts  = document.getElementById('tt-pts');
const ttNote = document.getElementById('tt-note');

function showTip(event, rankText, name, ptsText, note) {
  ttRank.textContent = rankText;
  ttName.textContent = name;
  ttPts.textContent  = ptsText;
  ttNote.textContent = note || '';
  ttNote.style.display = note ? '' : 'none';
  positionTip(event);
  tt.classList.add('visible');
}
function positionTip(event) {
  const pad = 14, w = tt.offsetWidth || 200, h = tt.offsetHeight || 90;
  let x = event.clientX + pad, y = event.clientY - h / 2;
  if (x + w > window.innerWidth - 8)  x = event.clientX - w - pad;
  if (y < 8) y = 8;
  if (y + h > window.innerHeight - 8) y = window.innerHeight - h - 8;
  tt.style.left = x + 'px'; tt.style.top = y + 'px';
}

svg.selectAll('.country')
  .data(countries.features.filter(d => String(d.id) !== '826'))
  .join('path')
  .attr('class', 'country')
  .attr('d', path)
  .attr('fill', d => {
    const r = RUGBY[String(d.id)];
    return r ? rankColor(r.pts, r.pos) : UNRANKED_COLOR;
  })
  .attr('stroke', d => {
    const r = RUGBY[String(d.id)];
    return r ? d3.color(rankColor(r.pts, r.pos)).darker(0.5) : '#1a1a1a';
  })
  .attr('stroke-width', '0.4px')
  .on('mousemove', (event, d) => {
    const r = RUGBY[String(d.id)];
    if (r) showTip(event, `#${r.pos} World Ranking`, r.name, `${r.pts.toFixed(2)} points`, null);
    else   showTip(event, 'Not ranked', d.id || 'Unknown', '', null);
  })
  .on('mouseleave', () => tt.classList.remove('visible'));

// ── UK home nations overlay ───────────────────────────────────
const ukDefs = [
  { name:'England', geo: ENG_GEO, pos:5,  pts:85.68 },
  { name:'Scotland', geo: SCO_GEO, pos:6,  pts:84.78 },
  { name:'Wales',    geo: WAL_GEO, pos:11, pts:76.38 },
];

ukDefs.forEach(nation => {
  const fill   = rankColor(nation.pts, nation.pos);
  const stroke = d3.color(fill).darker(0.5).toString();

  svg.selectAll(null)
    .data(nation.geo.features)
    .join('path')
    .attr('class', 'uk-lad')
    .attr('d', path)
    .attr('fill', fill)
    .attr('stroke', fill)   // hide internal LAD borders
    .on('mousemove', event => showTip(event,
      `#${nation.pos} World Ranking`, nation.name,
      `${nation.pts.toFixed(2)} points`, null))
    .on('mouseleave', () => tt.classList.remove('visible'));

  // Outer border drawn on top (separate pass so it's crisp)
  svg.append('path')
    .datum({ type:'FeatureCollection', features: nation.geo.features })
    .attr('class', 'uk-border')
    .attr('d', path)
    .attr('stroke', stroke)
    .attr('stroke-width', '0.6px');
});

svg.append('path').datum(borders).attr('class','border').attr('d', path);

const topBar = document.getElementById('top-bar');
RAW.slice(0,10).forEach(d => {
  const c = document.createElement('div');
  c.className = 'top-card';
  c.style.setProperty('--card-color', TOP10_COLORS[d.pos-1]);
  c.querySelector = undefined;
  c.innerHTML = `
    <div class="top-card-pos">#${d.pos}</div>
    <div class="top-card-name">${d.name}</div>
    <div class="top-card-pts">${d.pts.toFixed(2)} pts</div>
  `;
  c.querySelector = undefined;
  // Colour the left border with the map colour
  c.style.setProperty('--card-color', TOP10_COLORS[d.pos-1]);
  c.style.cssText += `--card-color:${TOP10_COLORS[d.pos-1]}`;
  c.firstElementChild && (c.firstElementChild.style.color = TOP10_COLORS[d.pos-1]);
  c.style.borderLeftColor = TOP10_COLORS[d.pos-1];
  topBar.appendChild(c);
});
// Fix: override the ::before pseudo with inline border trick
document.querySelectorAll('.top-card').forEach((card, i) => {
  card.style.borderLeft = `2px solid ${TOP10_COLORS[i]}`;
});

function tier(p) { return p<=12?1:p<=20?2:p<=40?3:4; }
function tierLabel(t) { return ['','Tier 1','Tier 2','Tier 3','Tier 4'][t]; }
function moveEl(pos,prev) {
  const d=prev-pos;
  if(d>0) return `<span class="move up">▲ ${d}</span>`;
  if(d<0) return `<span class="move down">▼ ${Math.abs(d)}</span>`;
  return `<span class="move same">—</span>`;
}

const tbody = document.getElementById('rankings-body');
function renderTable(ft) {
  tbody.innerHTML='';
  RAW.forEach(d => {
    const t=tier(d.pos);
    if(ft!=='all'&&String(t)!==ft&&!(ft==='3'&&t>=3)) return;
    if(ft==='3'&&t<3) return;
    const rc = d.pos<=3?'rank-num top3':'rank-num';
    const fill = d.pos<=114 ? rankColor(d.pts, d.pos) : UNRANKED_COLOR;
    const swatch = `<span class="rank-swatch" style="background:${fill}"></span>`;
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td><span class="${rc}">${d.pos}</span></td>
      <td>${swatch}<span class="country-name">${d.name}</span></td>
      <td class="right"><span class="pts-val">${d.pts.toFixed(2)}</span></td>
      <td class="right">${moveEl(d.pos,d.prevPos)}</td>
      <td class="right"><span class="tier tier-${t}">${tierLabel(t)}</span></td>
    `;
    tbody.appendChild(tr);
  });
}
renderTable('all');

document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderTable(btn.dataset.tier);
  });
});

document.getElementById('updated-date').textContent = `Rankings as of ${ds}`;
document.getElementById('footer-date').textContent  = `Last updated ${ds}`;
