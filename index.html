<title>World Rugby Rankings</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.2/plotly.min.js"></script>

<style>
  :root {
    --bg:        #090e0b;
    --bg-card:   #0f1a12;
    --bg-muted:  #152019;
    --border:    #1e3326;
    --fg:        #d4e8da;
    --fg-muted:  #6b9477;
    --fg-dim:    #2e4d38;
    --gold:      #e8b84b;
    --gold-dim:  #8a6b1c;
    --green:     #22a65c;
    --up:        #4ade80;
    --down:      #f87171;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Barlow', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    margin: 0;
    padding-block: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-block: 20px 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0;
  }
  .header-left { display: flex; flex-direction: column; gap: 4px; }
  .eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--gold);
  }
  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(24px, 5vw, 40px);
    font-weight: 800;
    line-height: 1;
    color: var(--fg);
    margin: 0;
    text-wrap: balance;
  }
  h1 span { color: var(--gold); }
  .updated {
    font-size: 12px;
    color: var(--fg-muted);
    font-weight: 300;
  }
  .header-stats {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }
  .stat {
    text-align: right;
  }
  .stat-val {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--gold);
    display: block;
    line-height: 1;
  }
  .stat-label {
    font-size: 11px;
    color: var(--fg-muted);
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  /* ── Map ── */
  #map {
    width: 100%;
    height: clamp(300px, 55vh, 560px);
    margin-bottom: 0;
  }

  /* ── Top bar ── */
  .top-bar {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-block: 16px;
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
  }
  .top-bar::-webkit-scrollbar { display: none; }
  .top-card {
    flex: 0 0 auto;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    min-width: 130px;
    position: relative;
    overflow: hidden;
  }
  .top-card::before {
    content: '';
    position: absolute;
    inset: 0 auto 0 0;
    width: 2px;
    background: var(--gold);
  }
  .top-card-pos {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .1em;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .top-card-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--fg);
    line-height: 1.2;
  }
  .top-card-pts {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    color: var(--fg-muted);
    margin-top: 2px;
  }

  /* ── Table ── */
  .table-section {
    padding-block: 24px 32px;
  }
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .section-head h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--fg-muted);
    margin: 0;
  }
  .filter-wrap { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    background: var(--bg-muted);
    border: 1px solid var(--border);
    color: var(--fg-muted);
    padding: 4px 10px;
    border-radius: 3px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .filter-btn:hover, .filter-btn.active {
    border-color: var(--gold);
    color: var(--gold);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  thead th {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--fg-dim);
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  thead th.right { text-align: right; }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background .1s;
  }
  tbody tr:hover { background: var(--bg-muted); }
  td { padding: 9px 10px; vertical-align: middle; }
  td.right { text-align: right; }

  .rank-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--fg-muted);
    min-width: 28px;
    display: inline-block;
  }
  .rank-num.top3 { color: var(--gold); }

  .country-name {
    font-weight: 500;
    color: var(--fg);
  }
  .map-note {
    font-size: 11px;
    color: var(--fg-dim);
    margin-left: 6px;
  }

  .pts-val {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
  }

  .move {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 2px;
    min-width: 36px;
    justify-content: flex-end;
    font-variant-numeric: tabular-nums;
  }
  .move.up   { color: var(--up); }
  .move.down { color: var(--down); }
  .move.same { color: var(--fg-dim); }

  .tier {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 2px;
    white-space: nowrap;
  }
  .tier-1 { background: rgba(232,184,75,.15); color: var(--gold); }
  .tier-2 { background: rgba(34,166,92,.15);  color: var(--green); }
  .tier-3 { background: rgba(107,148,119,.12); color: var(--fg-muted); }
  .tier-4 { background: rgba(46,77,56,.2); color: var(--fg-dim); }

  footer {
    border-top: 1px solid var(--border);
    padding-block: 20px;
    font-size: 12px;
    color: var(--fg-dim);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  footer a { color: var(--fg-muted); }
</style>

<header class="header">
  <div class="header-left">
    <span class="eyebrow">Men's 15s</span>
    <h1>World Rugby <span>Rankings</span></h1>
    <span class="updated" id="updated-date"></span>
  </div>
  <div class="header-stats">
    <div class="stat">
      <span class="stat-val" id="stat-nations"></span>
      <span class="stat-label">Nations</span>
    </div>
    <div class="stat">
      <span class="stat-val" id="stat-leader"></span>
      <span class="stat-label">World #1</span>
    </div>
    <div class="stat">
      <span class="stat-val" id="stat-leader-pts"></span>
      <span class="stat-label">Points</span>
    </div>
  </div>
</header>

<div id="map"></div>

<div class="top-bar" id="top-bar"></div>

<div class="table-section">
  <div class="section-head">
    <h2>Full Rankings</h2>
    <div class="filter-wrap">
      <button class="filter-btn active" data-tier="all">All</button>
      <button class="filter-btn" data-tier="1">Tier 1</button>
      <button class="filter-btn" data-tier="2">Tier 2</button>
      <button class="filter-btn" data-tier="3">Tier 3+</button>
    </div>
  </div>
  <table>
    <thead>
      <tr>
        <th>Rank</th>
        <th>Nation</th>
        <th class="right">Points</th>
        <th class="right">Change</th>
        <th class="right">Tier</th>
      </tr>
    </thead>
    <tbody id="rankings-body"></tbody>
  </table>
</div>

<footer>
  <span>Data: <a href="https://www.world.rugby/rankings" target="_blank" rel="noopener">World Rugby</a> · Men's 15s</span>
  <span id="footer-date"></span>
</footer>

// UK home nations: England, Scotland, Wales all map to GBR
// Use England (highest ranked) for the map colour; others note in table
const CODE_MAP = { ENG: 'GBR', SCO: 'GBR', WAL: 'GBR' };
const UK_NOTE  = new Set(['ENG','SCO','WAL']);

function isoToMapCode(c) {
  return CODE_MAP[c] || c;
}

function tier(pos) {
  if (pos <= 12) return 1;
  if (pos <= 20) return 2;
  if (pos <= 40) return 3;
  return 4;
}
function tierLabel(t) {
  return ['','Tier 1','Tier 2','Tier 3','Tier 4'][t];
}
function tierClass(t) {
  return 'tier tier-' + t;
}

function moveEl(pos, prevPos) {
  const diff = prevPos - pos; // positive = moved up
  if (diff > 0) return `<span class="move up">▲ ${diff}</span>`;
  if (diff < 0) return `<span class="move down">▼ ${Math.abs(diff)}</span>`;
  return `<span class="move same">—</span>`;
}

// ── Header stats ─────────────────────────────────────────────
const now = new Date();
const dateStr = now.toLocaleDateString('en-AU', {day:'numeric', month:'long', year:'numeric'});
document.getElementById('updated-date').textContent = `Rankings as of ${dateStr}`;
document.getElementById('footer-date').textContent   = `Last updated ${dateStr}`;
document.getElementById('stat-nations').textContent  = RAW.length;
document.getElementById('stat-leader').textContent   = RAW[0].name;
document.getElementById('stat-leader-pts').textContent = RAW[0].pts.toFixed(2);

// ── Top 10 cards ─────────────────────────────────────────────
const topBar = document.getElementById('top-bar');
RAW.slice(0, 10).forEach(d => {
  const card = document.createElement('div');
  card.className = 'top-card';
  card.innerHTML = `
    <div class="top-card-pos">#${d.pos}</div>
    <div class="top-card-name">${d.name}</div>
    <div class="top-card-pts">${d.pts.toFixed(2)} pts</div>
  `;
  topBar.appendChild(card);
});

// ── Rankings table ────────────────────────────────────────────
const tbody = document.getElementById('rankings-body');
function renderTable(filterTier) {
  tbody.innerHTML = '';
  RAW.forEach(d => {
    const t = tier(d.pos);
    if (filterTier !== 'all' && String(t) !== filterTier &&
        !(filterTier === '3' && t >= 3)) return;
    if (filterTier === '3' && t < 3) return;

    const tr = document.createElement('tr');
    tr.dataset.tier = t;
    const rankClass = d.pos <= 3 ? 'rank-num top3' : 'rank-num';
    const ukNote = UK_NOTE.has(d.code)
      ? `<span class="map-note">(shown as GBR on map)</span>` : '';
    tr.innerHTML = `
      <td><span class="${rankClass}">${d.pos}</span></td>
      <td><span class="country-name">${d.name}</span>${ukNote}</td>
      <td class="right"><span class="pts-val">${d.pts.toFixed(2)}</span></td>
      <td class="right">${moveEl(d.pos, d.prevPos)}</td>
      <td class="right"><span class="${tierClass(t)}">${tierLabel(t)}</span></td>
    `;
    tbody.appendChild(tr);
  });
}
renderTable('all');

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTable(btn.dataset.tier);
  });
});

// ── Map ───────────────────────────────────────────────────────
// Build map data — for GBR use England's entry (highest ranked home nation)

const mapData = [];
RAW.forEach(d => {
  const mc = isoToMapCode(d.code);
  if (seen.has(mc)) return;
  seen.add(mc);
  const moveStr = d.prevPos - d.pos > 0
    ? `▲ ${d.prevPos - d.pos}` : d.prevPos - d.pos < 0
    ? `▼ ${Math.abs(d.prevPos - d.pos)}` : '—';
  const displayName = mc === 'GBR' ? 'United Kingdom (Eng #5 / Sco #6 / Wal #11)' : d.name;
  mapData.push({
    code: mc,
    pts: d.pts,
